name: Merge dependency updates

# Dependabot's update PRs are merged as soon as CI passes on them, so they never pile up waiting for a
# person (nobody reviews PRs on this project). A red one stays open for the daily caretaker session.
# Runs on workflow_run because a workflow started by a Dependabot PR only gets a read-only token.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the PR that just passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --state open --json number,author,headRefOid \
            --jq ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | .number")
          if [ -z "$PR" ]; then
            echo "No open Dependabot PR at $SHA on $BRANCH (already merged, or a newer commit is being checked)."
            exit 0
          fi
          gh pr merge "$PR" --squash --match-head-commit "$SHA"
