name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run; every commit on main keeps its own result.
concurrency:
  # One run per branch: a newer commit cancels the older run, so a burst of commits
  # never builds a queue (the account's runners are shared with other repos).
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (high or critical in runtime deps fails the run)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build (validates data, then static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
