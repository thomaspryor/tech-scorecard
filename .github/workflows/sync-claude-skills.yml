name: Sync Claude skills

# Every day: copy the latest Claude commands, agents and skills this repo borrows from
# Broadway Scorecard (public, so no token is needed) and commit them if anything changed.
# The list of what is synced is in scripts/lib/claude-sync.js. Changes only touch .claude/,
# not the site. A failure opens a GitHub issue (which emails the owner); the next clean run closes it.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-claude-skills
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          repository: thomaspryor/Broadwayscore
          path: .cache/broadwayscore
          sparse-checkout: .claude
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/sync-claude-skills.js --from=.cache/broadwayscore
      - name: Commit if anything changed
        run: |
          git config user.name "tech-scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .claude
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Sync Claude skills from Broadway Scorecard ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Open or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create skills-sync-failed --color B60205 --description "Claude skills sync needs a look" --force
          BODY="Copying the Claude skills from Broadway Scorecard failed on $(date -u +%Y-%m-%d). The site is not affected. To fix it, start a Claude Code session on this repository and paste this link: $RUN_URL"
          OPEN=$(gh issue list --label skills-sync-failed --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "Claude skills sync needs a look" --label skills-sync-failed --body "$BODY"
          fi
      - name: Close the alert issue after a clean run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label skills-sync-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The skills sync ran cleanly on $(date -u +%Y-%m-%d). Closing."
          done
