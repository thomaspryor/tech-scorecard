name: Weekly refresh

# Every Monday: look for new reviews of products already on the site and for new launches,
# check every quote against the outlet's page, score with two models, build, and commit
# only if every step passes. Vercel deploys the commit like any other push to main.
# Needs two repository secrets: OPENAI_API_KEY and GEMINI_API_KEY.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      max_products:
        description: 'How many products to check for new reviews'
        default: '15'

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY and GEMINI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm ci
      - name: Find, verify, score and build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/refresh-pipeline.sh --max-products=${{ inputs.max_products || '15' }}
      - name: Commit if anything changed
        run: |
          git config user.name "tech-scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Weekly refresh: new reviews and launches ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
