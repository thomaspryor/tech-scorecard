name: Daily refresh

# Every day: read the outlets' RSS feeds and search for new reviews of products already on the site
# (recent launches first) and for new launches,
# check every quote against the outlet's page, score with two models, build, and commit
# only if the build passes. Vercel deploys the commit like any other push to main.
# A single bad item is dropped rather than failing the run; whatever went wrong opens a GitHub
# issue (which emails the owner), and the next clean run closes it.
# Needs two repository secrets: OPENAI_API_KEY and GEMINI_API_KEY.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: 'How many products to check for new reviews'
        default: '15'

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY and GEMINI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm ci
      - name: Find, verify, score and build
        id: pipeline
        # Shorter than the job limit, so a hang ends as a normal failure and the alert step has time to run.
        timeout-minutes: 160
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/refresh-pipeline.sh --max-products=${{ inputs.max_products || '15' }}
      - name: Commit if anything changed
        run: |
          git config user.name "tech-scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Daily refresh: new reviews and launches ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if part of the run went wrong
        run: |
          if [ -s .cache/refresh/problems.txt ]; then
            cat .cache/refresh/problems.txt
            echo "::error::The rest of the run was committed, but these need a look."
            exit 1
          fi
      - name: Open or update the alert issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create refresh-failed --color B60205 --description "Daily refresh needs a look" --force
          {
            echo "The daily update of thetechscorecard.com hit a problem on $(date -u +%Y-%m-%d)."
            echo
            if [ "$PIPELINE" = success ]; then
              echo "The site is still up. Everything that passed every check was published; the rest was left out."
            else
              echo "The site is still up and unchanged: nothing from this run was published."
            fi
            echo
            if [ -s .cache/refresh/problems.txt ]; then
              echo "What went wrong:"
              sed 's/^/- /' .cache/refresh/problems.txt
              echo
            fi
            echo "To fix it, start a Claude Code session on this repository and paste this link: $RUN_URL"
          } > alert.md
          OPEN=$(gh issue list --label refresh-failed --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            # Running daily, a problem that lasts would email every day: only post when it is new.
            LAST=$(gh issue view "$OPEN" --json body,comments --jq '(.comments | last | .body) // .body')
            NOW=$(grep '^- ' alert.md | sort || true)
            PREV=$(printf '%s\n' "$LAST" | grep '^- ' | sort || true)
            if [ "$NOW" = "$PREV" ]; then
              echo "Same problem as already reported in issue $OPEN; not posting again."
            else
              gh issue comment "$OPEN" --body-file alert.md
            fi
          else
            gh issue create --title "Daily update needs a look" --label refresh-failed --body-file alert.md
          fi
      - name: Close the alert issue after a clean run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label refresh-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The daily update ran cleanly on $(date -u +%Y-%m-%d). Closing."
          done
